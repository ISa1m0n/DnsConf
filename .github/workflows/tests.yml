name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run tests
        run: mvn -B test
        env:
          # EnvironmentVariables требует эти переменные на загрузке класса,
          # даже если конкретный тест их не использует.
          DNS: nextdns
          CLIENT_ID: test
          AUTH_SECRET: test
