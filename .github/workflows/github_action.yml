name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '0 * * * *' # каждый час: страховка, если repository_dispatch от GeoHideDNS не прошёл
  repository_dispatch:
    types: [geohide-updated] # мгновенный запуск после того, как проверка с ПК сменила адреса
  workflow_dispatch:

# Два прогона читают и пишут один и тот же профиль, поэтому второй ждёт,
# а не обрывает первый на середине (обрыв между удалением и созданием rewrites
# оставил бы домены без адресов до следующего запуска).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Run application
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar
